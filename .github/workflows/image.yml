# Tests everything. Pull requests also build the Docker image (without pushing it), and
# release tags (v1.2.3) push it to ghcr.io/bartvs98/tidemark and create a GitHub
# Release. Merges to main only test. Changes that only touch docs don't run it (paths
# filters don't apply to tags, so a release always runs).
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

# A newer push to the same PR cancels the run it replaces. Runs on main and on tags
# always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go vet + gofmt
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Go tests
        run: go test ./...
      - name: Frontend tests
        working-directory: web
        run: |
          npm ci
          npx ng test --watch=false

  image:
    needs: test
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/tidemark
          # v1.2.3 → 1.2.3, 1.2, 1, latest and sha-<commit>. A pre-release (v1.3.0-rc.1)
          # only gets its own version and sha (latest=auto skips pre-releases).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
          flavor: latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 1.2.3 on a release (shown in the footer, settings and /api/health), pr-<n> on a PR.
          build-args: VERSION=${{ steps.meta.outputs.version }}
          # One manifest per image instead of an index plus untagged attestation manifests,
          # so cleanup.yml can delete untagged versions without breaking tagged images.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Leave a release that already exists (e.g. drafted by hand) alone.
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          pre=""
          if [[ "$TAG" == *-* ]]; then pre="--prerelease"; fi
          gh release create "$TAG" --verify-tag --generate-notes $pre

  cleanup:
    needs: release
    permissions:
      packages: write
    uses: ./.github/workflows/cleanup.yml
