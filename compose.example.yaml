# Copy to compose.yaml and adjust. Secrets go in a .env file next to it.
services:
  # Read-only gateway to the Docker API. Tidemark never touches the socket directly.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  tidemark:
    build: .
    image: tidemark:latest
    restart: unless-stopped
    depends_on: [socket-proxy]
    environment:
      TIDEMARK_DOCKER_HOST: tcp://socket-proxy:2375
      TIDEMARK_GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
