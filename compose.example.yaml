# Copy to compose.yaml (or paste into a stack in Portainer or a similar manager) and adjust.
# Secrets go in a .env file next to it (or the stack's environment).
services:
  # Read-only gateway to the Docker API. Tidemark never touches the socket directly.
  # Only reachable on this stack's internal network; never publish port 2375.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  tidemark:
    image: ghcr.io/bartvs98/tidemark:latest   # or `build: .` from a checkout
    restart: unless-stopped
    depends_on: [socket-proxy]
    environment:
      TIDEMARK_DOCKER_HOST: tcp://socket-proxy:2375
      TZ: Europe/Amsterdam   # your time zone: the schedule and digest follow it, daylight saving included (UTC without it)
      TIDEMARK_GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Telegram notifications (see the README):
      # TIDEMARK_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # TIDEMARK_TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # TIDEMARK_PUBLIC_URL: https://tidemark.example.com
      # Change settings in the Settings dialog (no login: anyone who can open Tidemark can change them):
      # TIDEMARK_SETTINGS_EDITABLE: "true"
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    labels:
      # Behind Traefik instead of a published port (Tidemark has no login: keep it internal):
      # - "traefik.enable=true"
      # - "traefik.http.routers.tidemark.rule=Host(`tidemark.example.com`)"
      # - "traefik.http.services.tidemark.loadbalancer.server.port=8080"
