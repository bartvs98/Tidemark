<tm-tide-backdrop />

<header class="sticky top-0 z-40 border-b border-line/60 bg-canvas/80 backdrop-blur-md">
  <div class="mx-auto flex h-16 max-w-7xl items-center gap-3 px-4 sm:px-8">
    <a routerLink="/" class="flex items-center gap-2.5 text-fg no-underline hover:no-underline" aria-label="Tidemark home">
      <svg class="size-7" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-width="2.5" aria-hidden="true">
        <path d="M9 11h14" class="stroke-fg" />
        <path d="M5 20.5c1.8-2.6 3.7-2.6 5.5 0s3.7 2.6 5.5 0 3.7-2.6 5.5 0 3.7 2.6 5.5 0" class="stroke-accent" />
      </svg>
      <span class="text-lg font-semibold tracking-tight">Tidemark</span>
    </a>

    <div class="ml-auto flex items-center gap-2">
      <tm-theme-switch />
      <button
        tmButton
        square
        variant="ghost"
        icon="settings"
        aria-label="Settings"
        aria-haspopup="dialog"
        [tmTooltip]="'Settings'"
        data-testid="settings-button"
        (click)="settingsOpen.set(true)"
      ></button>
    </div>
  </div>
</header>

<main class="mx-auto max-w-7xl px-4 pt-8 pb-16 sm:px-8 sm:pt-12 sm:pb-24">
  <router-outlet />
</main>

<footer class="mx-auto max-w-7xl px-4 pb-10 text-xs text-fg-subtle sm:px-8">
  @if (health.hasValue()) {
    Tidemark <span class="font-mono" data-testid="version">{{ health.value().version }}</span> ·
  }
  App icons by <a href="https://selfh.st/icons/" target="_blank" rel="noopener">selfh.st/icons</a>, licensed
  <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>.
</footer>

<tm-settings-dialog [(open)]="settingsOpen" />
<tm-toaster />
