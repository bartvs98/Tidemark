<header class="sticky top-0 z-40 border-b border-line bg-canvas/90 backdrop-blur">
  <div class="mx-auto flex h-14 max-w-6xl items-center gap-3 px-4 sm:gap-6 sm:px-6">
    <a routerLink="/" class="flex items-center gap-2.5 text-fg no-underline hover:no-underline" aria-label="Tidemark home">
      <svg class="size-6" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-width="2.5" aria-hidden="true">
        <path d="M9 11h14" class="stroke-fg" />
        <path d="M5 20.5c1.8-2.6 3.7-2.6 5.5 0s3.7 2.6 5.5 0 3.7-2.6 5.5 0 3.7 2.6 5.5 0" class="stroke-accent" />
      </svg>
      <span class="hidden text-lg font-semibold tracking-tight sm:inline">Tidemark</span>
    </a>

    <nav class="flex gap-1 text-sm font-medium" aria-label="Main">
      @for (link of [{ path: '/', label: 'Dashboard' }, { path: '/styleguide', label: 'Styleguide' }]; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-hover !text-fg"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-md px-2.5 py-1.5 text-fg-muted no-underline hover:text-fg hover:no-underline"
          >{{ link.label }}</a
        >
      }
    </nav>

    <div class="ml-auto">
      <tm-theme-switch />
    </div>
  </div>
</header>

<main class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
  <router-outlet />
</main>

<footer class="mx-auto max-w-6xl px-4 pb-8 text-xs text-fg-subtle sm:px-6">
  App icons by <a href="https://selfh.st/icons/" target="_blank" rel="noopener">selfh.st/icons</a>, licensed
  <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>.
</footer>

<tm-toaster />
