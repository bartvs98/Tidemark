@if (title(); as t) {
  <!-- relative z-10: hoverable above a stretched link, so the error shows; focusable so keyboard users get it too -->
  <span class="relative z-10 inline-flex items-center gap-1 text-xs text-fg-muted" tabindex="0" [tmTooltip]="t" data-testid="refresh-failed">
    <tm-icon name="history" [size]="12" class="shrink-0" /><span class="whitespace-nowrap">refresh failed</span>
    @if (reason(); as r) {
      <span class="whitespace-nowrap" data-testid="failure-reason">· {{ r }}</span>
    }
  </span>
}
