<tm-field [label]="label()" [hint]="hint()" [error]="error()" [locked]="locked()">
  @switch (state()) {
    @case ('typing') {
      <div class="flex items-center gap-2">
        <tm-password-input class="flex-1" [placeholder]="placeholder()" [value]="value() ?? ''" (valueChange)="value.set($event)" />
        <button tmButton type="button" variant="ghost" size="sm" [attr.aria-label]="'Cancel new ' + label()" (click)="cancel()">Cancel</button>
      </div>
    }
    @case ('clearing') {
      <div class="flex min-h-9 flex-wrap items-center gap-x-3 gap-y-1">
        <span class="inline-flex items-center gap-1.5 text-sm" data-testid="secret-clearing"><tm-icon name="x" />Cleared on Save</span>
        <button #undo tmButton type="button" variant="ghost" size="sm" [attr.aria-label]="'Undo clear ' + label()" (click)="cancel()">Undo</button>
      </div>
    }
    @default {
      <div class="flex min-h-9 flex-wrap items-center gap-x-3 gap-y-1">
        @if (field().set) {
          <span class="inline-flex items-center gap-1.5 text-sm" data-testid="secret-state"><tm-icon name="check" />Set</span>
        } @else {
          <span class="inline-flex items-center gap-1.5 text-sm text-fg-muted" data-testid="secret-state"><tm-icon name="circle-help" />Not set</span>
        }
        @if (!locked()) {
          <span class="flex gap-1">
            <button #start tmButton type="button" size="sm" [attr.aria-label]="(field().set ? 'Replace ' : 'Set ') + label()" (click)="replace()">
              {{ field().set ? 'Replace' : 'Set' }}
            </button>
            @if (field().set) {
              <button tmButton type="button" variant="ghost" size="sm" [attr.aria-label]="'Clear ' + label()" (click)="clear()">Clear</button>
            }
          </span>
        }
      </div>
    }
  }
</tm-field>
