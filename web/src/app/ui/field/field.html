<label [id]="labelId()" [attr.for]="controlId()" class="min-w-0 text-sm font-medium text-fg" (click)="focusControl()">
  {{ label() }}
  @if (required()) {
    <span class="text-fg-subtle" aria-hidden="true">*</span>
  }
</label>
<div class="min-w-0" [class]="inline() ? 'col-start-2 row-span-2 row-start-1 flex justify-end' : ''">
  <ng-content />
</div>
@switch (message()) {
  @case ('error') {
    <p [id]="messageId" class="col-start-1 flex min-w-0 items-start gap-1.5 text-sm text-attention">
      <tm-icon name="triangle-alert" [size]="14" class="mt-0.5" />
      <span class="min-w-0 break-words"><span class="sr-only">Error: </span>{{ error() }}</span>
    </p>
  }
  @case ('locked') {
    <p [id]="messageId" class="col-start-1 flex min-w-0 items-start gap-1.5 text-sm text-fg-muted">
      <tm-icon name="lock" [size]="14" class="mt-0.5" />
      <span class="min-w-0 break-words">
        @for (part of lockedParts(); track $index) {
          @if (part.mono) {
            <span class="font-mono">{{ part.text }}</span>
          } @else {
            {{ part.text }}
          }
        }
      </span>
    </p>
  }
  @case ('hint') {
    <p [id]="messageId" class="col-start-1 min-w-0 text-sm text-fg-muted">{{ hint() }}</p>
  }
}
