<input
  #field
  tmInput
  class="pr-10"
  [type]="shown() ? 'text' : 'password'"
  [size]="size()"
  [mono]="mono()"
  [invalid]="invalid()"
  [touched]="touched()"
  [value]="value()"
  [disabled]="disabled()"
  [readOnly]="readonly()"
  [attr.name]="name() || null"
  [attr.aria-label]="tmField ? null : (label() ?? null)"
  [placeholder]="placeholder()"
  [attr.autocomplete]="autocomplete()"
  spellcheck="false"
  autocapitalize="off"
  (input)="value.set(field.value)"
  (blur)="touch.emit()"
/>
<button
  type="button"
  class="absolute top-1/2 right-1.5 inline-flex -translate-y-1/2 cursor-pointer items-center justify-center rounded-sm text-fg-muted transition-colors hover:bg-hover hover:text-fg disabled:pointer-events-none disabled:opacity-50"
  [class]="size() === 'sm' ? 'size-6' : 'size-7'"
  aria-label="Show"
  [attr.aria-pressed]="shown()"
  [disabled]="disabled()"
  (click)="toggle()"
>
  <tm-icon [name]="shown() ? 'eye-off' : 'eye'" [size]="size() === 'sm' ? 14 : 16" />
</button>
