<div class="flex items-center gap-1.5 text-sm text-fg-muted">
  @if (icon(); as icon) {
    <tm-icon [name]="icon" [size]="14" class="text-fg-subtle" />
  }
  <span class="truncate">{{ label() }}</span>
</div>
<div class="mt-1 flex min-w-0 items-baseline gap-1">
  <span class="truncate font-semibold tracking-tight text-fg" [class]="mono() ? 'font-mono text-xl' : 'text-2xl'">{{ text() }}</span>
  @if (unit()) {
    <span class="shrink-0 text-sm text-fg-muted">{{ unit() }}</span>
  }
</div>
@if (hint()) {
  <div class="mt-0.5 truncate text-xs text-fg-muted">{{ hint() }}</div>
}
