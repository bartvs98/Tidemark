<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Tidemark</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070d17">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Apply the saved theme before first paint (see ui/theme.ts), and point the browser bar
    // (theme-color) at the resolved theme's page background (--color-canvas, THEME_COLORS).
    try {
      var t = localStorage.getItem('tidemark.theme');
      if (t === 'light' || t === 'dark' || t === 'system') document.documentElement.dataset.theme = t;
      var light = t === 'light' || (t === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches);
      if (light) document.querySelector('meta[name="theme-color"]').content = '#f4f7fa';
    } catch (e) {}
  </script>
</head>
<body>
  <tm-root></tm-root>
</body>
</html>
