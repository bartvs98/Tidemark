<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Tidemark</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070d17">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Apply the saved theme before first paint (see ui/theme.ts).
    try {
      var t = localStorage.getItem('tidemark.theme');
      if (t === 'light' || t === 'dark' || t === 'system') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <tm-root></tm-root>
</body>
</html>
